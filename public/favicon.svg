<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A1633"/>
      <stop offset="100%" stop-color="#05070E"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#bgGrad)"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#F2EFE9" stroke-opacity="0.85" stroke-width="1.5"/>
  <circle cx="22" cy="10" r="2.5" fill="#FF3B4E" filter="url(#glow)"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FF3B4E" flood-opacity="0.35" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <text x="16" y="20.5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#F2EFE9" text-anchor="middle" letter-spacing="-0.5">RS</text>
</svg>